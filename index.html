<!doctype html>
<html lang="fr" data-theme="omni">
  <head>
    <meta charset="utf-8" />
    <!-- interactive-widget : quand le clavier du téléphone s'ouvre, la page
         rétrécit au lieu d'être recouverte (la cellule reste visible). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="description" content="Tableur : un tableur simple qui fonctionne hors ligne. Les données restent sur l'appareil." />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#1d1929" />
    <title>Tableur</title>
    <link rel="stylesheet" href="css/themes.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/grille.css" />
    <script src="js/config.js"></script>
    <script type="module" src="js/app.js"></script>
  </head>
  <body>
    <!-- Icônes (dessinées pour l'application). On les réutilise avec <use href="#…">. -->
    <svg class="icones" aria-hidden="true" focusable="false">
      <symbol id="i-tableur" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2.5" fill="none" stroke="currentColor" stroke-width="2" /><path d="M3 9.5h18M3 15h18M9 4v16" fill="none" stroke="currentColor" stroke-width="2" /></symbol>
      <symbol id="i-annuler" viewBox="0 0 24 24"><path d="M9 15 4 10l5-5M4 10h10a6 6 0 0 1 0 12h-3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></symbol>
      <symbol id="i-retablir" viewBox="0 0 24 24"><path d="m15 15 5-5-5-5M20 10H10a6 6 0 0 0 0 12h3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></symbol>
      <symbol id="i-valider" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" /></symbol>
      <symbol id="i-fermer" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" /></symbol>
    </svg>

    <header class="entete">
      <span class="marque" aria-hidden="true"><svg><use href="#i-tableur" /></svg></span>
      <label class="titre-classeur">
        <span class="visuellement-cache">Titre du classeur</span>
        <input id="titre" type="text" value="Sans titre" maxlength="120" autocomplete="off" spellcheck="false" />
      </label>
    </header>

    <div class="barre-outils" role="toolbar" aria-label="Outils">
      <button id="bouton-annuler" class="outil" type="button" title="Annuler (Ctrl+Z)" disabled>
        <svg aria-hidden="true"><use href="#i-annuler" /></svg><span class="libelle">Annuler</span>
      </button>
      <button id="bouton-retablir" class="outil" type="button" title="Rétablir (Ctrl+Y)" disabled>
        <svg aria-hidden="true"><use href="#i-retablir" /></svg><span class="libelle">Rétablir</span>
      </button>
    </div>

    <div class="barre-formule">
      <input id="nom-cellule" class="nom-cellule" type="text" value="A1" autocomplete="off" spellcheck="false" autocapitalize="characters" aria-label="Cellule active (tapez une adresse puis Entrée pour y aller)" />
      <span class="fx" aria-hidden="true">fx</span>
      <input id="champ-formule" class="champ-formule" type="text" autocomplete="off" spellcheck="false" autocapitalize="off" autocorrect="off" enterkeyhint="enter" aria-label="Contenu de la cellule active" />
      <button id="valider-saisie" class="outil-rond" type="button" title="Valider (Entrée)" aria-label="Valider la saisie">
        <svg aria-hidden="true"><use href="#i-valider" /></svg>
      </button>
      <button id="annuler-saisie" class="outil-rond" type="button" title="Annuler la saisie (Échap)" aria-label="Annuler la saisie">
        <svg aria-hidden="true"><use href="#i-fermer" /></svg>
      </button>
    </div>

    <main id="zone-grille" class="zone-grille" tabindex="0" aria-label="Grille du tableur">
      <!-- Champ de saisie posé sur la cellule active (invisible tant qu'on ne tape pas). -->
      <input id="editeur-cellule" class="editeur-cellule" type="text" autocomplete="off" spellcheck="false" autocapitalize="off" autocorrect="off" enterkeyhint="enter" aria-label="Saisie dans la cellule active" />
    </main>

    <footer class="barre-etat">
      <span id="message" class="message" aria-live="polite"></span>
      <span id="statistiques" class="statistiques"></span>
    </footer>
  </body>
</html>
